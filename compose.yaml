services:
  db:
    image: postgres:17-alpine
    container_name: local-mip-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mip
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: local-mip-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: pg@renji.com
      PGADMIN_DEFAULT_PASSWORD: mip
    ports:
      - "5050:80"
    depends_on:
      - db
    

volumes:
  pgdata: